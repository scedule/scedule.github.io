<!DOCTYPE html>
<html>
<head>
    <title>Gone Fishing!</title>
    <link href="https://fonts.googleapis.com/css?family=Black+Ops+One|Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <script>
        (function() {
            var theme = localStorage.getItem('themeColor') || 'default';
            var mode = localStorage.getItem('themeMode') || 'light';
            var customBg = localStorage.getItem('customBg');
            if (mode === 'dark') document.body.classList.add('dark');
            if (theme !== 'default') document.body.classList.add('theme-' + theme);
            if (theme === 'custom' && customBg) {
                document.body.style.setProperty('--bg', 'url(' + customBg + ')');
                var brightness = localStorage.getItem('customBgBrightness');
                if (brightness === 'light') document.body.classList.add('light-img');
            }
        })();
    </script>
    <a href="../../beta/index.html" style="position: absolute; top: 10px; left: 10px; padding: 10px 15px; background: rgba(255,255,255,0.8); border-radius: 8px; text-decoration: none; color: #333; font-family: sans-serif; font-weight: bold; z-index: 1000; border: 2px solid #333;">← Back to Beta</a>

<body>
    <div id="game-container">
        <h1 id="start-title">Gone Fishing!</h1>
        <div id="info-wrapper">
            <div id="instructions"></div>
            <button id="start-btn"><span class="arrow"></span></button>
        </div>
        <div id="game-stats">
            <span id="game-day">Day 1</span>

            <div id="clock">
                <svg viewBox="0 0 120 120" class="chart-gauge" fill="none" stroke-width="4">
                    <circle class="timer-backdrop" r="40" cx="60" cy="60"></circle>
                    <circle class="timer-gauge" r="40" cx="60" cy="60"></circle>
                    <text y="50%" x="50%" id="game-timer" class="timer-time">15s</text>
                </svg>
            </div>
            <span id="game-score">Total Score: 0</span>
        </div>
        <p id="game-goal"></p>
    </div>
    <div id="click-container">
        <span id="line"></span>
    </div>
    <div id="bubbles"></div>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
